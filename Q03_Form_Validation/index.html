<!doctype html>
<html>
  <head>
    <title>Form Validation</title>
  </head>
  <body>
    <h2>Registration Form</h2>
    <form onsubmit="return validateForm();">
      <input id="name" placeholder="Name" /><br /><input
        id="email"
        placeholder="Email"
      /><br />
      <input id="pass" type="password" placeholder="Password" /><br /><button>
        Submit
      </button>
    </form>
    <script src="script.js"></script>
  </body>
</html>
